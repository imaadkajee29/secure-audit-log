name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt in to anything more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Test with coverage gate (90% lines)
        run: npm run coverage
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
      - run: npm run build

      - name: Coverage summary
        if: always()
        run: |
          node -e "const s=require('./coverage/coverage-summary.json').total;
          console.log('| Metric | % |\n|---|---|');
          for (const k of ['lines','statements','functions','branches']) console.log('| '+k+' | '+s[k].pct+' |');" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  container:
    name: Build & scan container
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write # upload Trivy results to the Security tab
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: secure-audit-log:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 3000:3000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e AUDIT_HMAC_KEY="$(openssl rand -base64 48)" \
            -e DB_PATH=:memory: \
            secure-audit-log:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

      - name: Scan image for vulnerabilities (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-audit-log:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan image (SARIF for the Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-audit-log:ci
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: secure-audit-log:ci
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
