name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to GHCR
      id-token: write # keyless signing with Sigstore (OIDC)
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max # SLSA build provenance attestation
          sbom: true # SBOM attestation attached to the image

      - name: Gate on vulnerabilities before signing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > notes.md <<NOTES
          ## Container image

          \`${IMAGE}@${DIGEST}\`

          Verify the signature:

          \`\`\`bash
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES

          # Works whether the release was created in the GitHub UI or only a tag was pushed.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" sbom.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
            existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            printf '%s\n\n%s\n' "$existing" "$(cat notes.md)" > combined.md
            gh release edit "$TAG" --notes-file combined.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" sbom.spdx.json --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --notes-file notes.md
          fi
